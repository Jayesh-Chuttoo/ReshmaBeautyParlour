<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in - Reshma Beauty Parlour</title>
  <!-- Search engines should not list the admin site -->
  <meta name="robots" content="noindex">

  <link rel="stylesheet" href="css/palette.css">
  <link rel="stylesheet" href="css/siteShell.css">
  <link rel="stylesheet" href="css/adminLogin.css">
  <link rel="icon" href="images/logoReshma.svg">
</head>
<body class="loginPage">

  <!-- This is the first page of the admin website. The other admin
       screens are in pages/. The client website is a separate site. -->
  <main class="loginBox">
    <img class="loginLogo" src="images/logoReshma.svg" alt="">
    <h1>Admin sign in</h1>
    <p class="small muted">For salon staff only.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username">
        <span class="errorText">Enter the email address you sign in with.</span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <!-- maxlength stops typing after 8 characters, the most a password can have -->
        <input type="password" id="password" name="password" maxlength="8" autocomplete="current-password">
        <span class="errorText">Enter your password.</span>
      </div>

      <label class="checkboxRow showPassword">
        <input type="checkbox" id="showPassword">
        <span>Show password</span>
      </label>

      <button class="button buttonMain buttonWide" type="submit">Sign in</button>
    </form>
  </main>

  <!-- This screen has no header or footer, so it loads fewer components -->
  <script src="js/data/adminAccount.js"></script>
  <script src="js/data/adminSettings.js"></script>
  <script src="js/modalPopup.js"></script>
  <script src="js/components/messageModal.js"></script>
  <script src="js/components/formField.js"></script>
  <script src="js/components/passwordRules.js"></script>
  <script src="js/adminLogin.js"></script>
</body>
</html>
